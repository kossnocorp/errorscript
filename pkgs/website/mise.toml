[tasks.dev]
run = "fnox exec -- pnpm exec astro dev --host 0.0.0.0"
depends = "gen/types"

[tasks.build]
run = "pnpm exec astro build"
depends = "gen/types"

[tasks.deploy]
run = "fnox exec -- pnpm exec wrangler deploy"
depends = "build"

[tasks."gen/types"]
run = "pnpm exec wrangler types"
sources = ["wrangler.toml"]
outputs = ["worker-configuration.d.ts"]

[tasks.types]
description = "Checks website TypeScript types"
depends = ["gen/types"]
run = "pnpm exec astro sync && pnpm exec tsc --noEmit"

[tasks."types:watch"]
depends = ["gen/types"]
run = "pnpm exec astro sync && pnpm exec tsc --noEmit --watch"
