[package]
name = "errorscript_lib"
version = "0.0.0"
edition = "2024"
publish = false
description = "ErrorScript lib build system"
license = "MIT"

[[bin]]
name = "errs-lib"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
oxc_allocator = "0.148.0"
oxc_ast = "0.148.0"
oxc_ast_visit = "0.148.0"
oxc_parser = "0.148.0"
oxc_span = "0.148.0"
oxc_syntax = "0.148.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3.27.0"
