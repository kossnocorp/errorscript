[package]
name = "errorscript"
version = "0.0.0"
edition = "2024"
description = "Typed errors in TypeScript without verbosity"
authors = ["Sasha Koss <koss@nocorp.me>"]
license = "MIT"
repository = "https://github.com/kossnocorp/errorscript"

[[bin]]
name = "esc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
glob = "0.3.3"
im = "15.1.0"
oxc_allocator = "0.148.0"
oxc_ast = "0.148.0"
oxc_ast_visit = "0.148.0"
oxc_diagnostics = "0.148.0"
oxc_parser = "0.148.0"
oxc_resolver = "11.24.3"
oxc_span = "0.148.0"
oxc_syntax = "0.148.0"
oxc_semantic = { version = "0.148.0", features = ["cfg"] }
petgraph = { version = "0.8.3", default-features = false, features = ["std"] }
relative-path = "1.9.3"
self_cell = "1.3.0"
stacker = "0.1"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "0.9.8"
usage = { package = "usage-rs", version = "6" }

[dev-dependencies]
tempfile = "3.27.0"
insta = { version = "1.48.0", features = ["ron"] }
indoc = "2.0.7"
