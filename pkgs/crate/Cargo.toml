[package]
name = "errorscript"
version = "0.0.0"
edition = "2024"
description = "Typed errors in TypeScript without verbosity"
authors = ["Sasha Koss <koss@nocorp.me>"]
license = "MIT"
repository = "https://github.com/kossnocorp/errorscript"

[[bin]]
name = "esc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
glob = "0.3.3"
oxc_allocator = { path = "../../vendor/oxc/crates/oxc_allocator" }
oxc_ast = { path = "../../vendor/oxc/crates/oxc_ast" }
oxc_ast_visit = { path = "../../vendor/oxc/crates/oxc_ast_visit" }
oxc_parser = { path = "../../vendor/oxc/crates/oxc_parser" }
oxc_resolver = "11.24.3"
oxc_span = { path = "../../vendor/oxc/crates/oxc_span" }
oxc_syntax = { path = "../../vendor/oxc/crates/oxc_syntax" }
oxc_type_checker = { path = "../../vendor/oxc/crates/oxc_type_checker" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "0.9.8"
usage = { package = "usage-rs", version = "6" }

[dev-dependencies]
tempfile = "3.27.0"
insta = { version = "1.48.0", features = ["ron"] }
indoc = "2.0.7"
