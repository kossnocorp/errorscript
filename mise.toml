# Monorepo =====================================================================

monorepo_root = true
[monorepo]
config_roots = ["pkgs/*"]

[tools]

# Stack ========================================================================

# Node.js
node = "24"
"npm:pnpm" = { version = "next-12", allow_builds = true }

# Tools
cargo-binstall = "latest" # Install cargo binaries

# Settings =====================================================================

[settings]
lockfile = true
idiomatic_version_file_enable_tools = ["rust"] # Use rust-toolchain.toml


# Tasks ========================================================================

[tasks."subs/init"]
run = "git submodule update --init --recursive"

[tasks.install]
depends = ["install/pnpm"]

[tasks."install/pnpm"]
run = "pnpm install"

[tasks."build:dev"]
description = "Builds the development ErrorScript compiler"
dir = "subs/errs"
run = "cargo build --profile dev -p tsrs_cli"

[tasks.symlink]
description = "Links the development compiler as ~/.local/bin/errs"
depends = ["build:dev"]
run = "node scripts/symlink.mjs"
