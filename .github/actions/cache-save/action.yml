name: Save Cache
description: Save development caches.

inputs:
  enable-node:
    required: false
    default: "false"
    description: Whether to store the pnpm cache.

runs:
  using: composite
  steps:
    - name: Lookup Cargo Cache
      id: lookup-cargo
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
        lookup-only: true

    - name: Save Cargo Cache
      if: steps.lookup-cargo.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}

    - name: Get pnpm Store Path
      if: inputs.enable-node == 'true'
      id: pnpm-store
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

    - name: Lookup pnpm Cache
      if: inputs.enable-node == 'true'
      id: lookup-pnpm
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        lookup-only: true

    - name: Save pnpm Cache
      if: inputs.enable-node == 'true' && steps.lookup-pnpm.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Lookup mise Cache
      id: lookup-mise
      uses: actions/cache/restore@v6
      with:
        path: ~/.local/share/mise
        key: mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock', 'mise.toml', 'rust-toolchain.toml') }}
        lookup-only: true

    - name: Save mise Cache
      if: steps.lookup-mise.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.local/share/mise
        key: mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock', 'mise.toml', 'rust-toolchain.toml') }}
